<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Character | Drago Russo Games</title>
  <link rel="icon" type="image/png" href="/assets/LogoDrago_Mesa_de_trabajo_1.png" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/styles/first-edition.css" />
  <link rel="stylesheet" href="/styles/character-vault.css" />
</head>
<body>
  <main class="vault-shell">
    <section class="vault-hero">
      <div>
        <div class="vault-eyebrow">Dragonlance</div>
        <h1>Opening Character Builder</h1>
        <p>The player character builder now lives inside the player app.</p>
      </div>
      <div class="vault-actions">
        <a class="vault-button" href="/characters/new" data-builder-link>Open Builder</a>
      </div>
    </section>
  </main>
  <script>
    const target = window.location.hostname === "dragolance.dragorussogames.com" ? "/characters/new" : "/portal/characters/new";
    document.querySelector("[data-builder-link]").href = target;
    window.location.replace(target);
  </script>
</body>
</html>
