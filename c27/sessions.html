<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>C27 Session Records</title>

  <link rel="icon" type="image/png" href="../assets/LogoDrago_Mesa_de_trabajo_1.png" />
  <link rel="stylesheet" href="../style.css" />
</head>

<body>

<main class="page">

  <section class="campaign-dashboard">

    <div class="dashboard-shell">

      <div class="dashboard-header">

        <div>
          <p class="eyebrow">
            Campaign 27 • Sunday 9:00 AM GMT-5
          </p>

          <h1>Session Records</h1>
        </div>

        <div class="actions">
          <a class="btn ghost" href="./index.html">
            Return to Campaign
          </a>
        </div>

      </div>

      <div class="dashboard-layout">

        <aside class="session-sidebar">

          <div class="sidebar-header">
            Saved Sessions
          </div>

          <div id="sessionList"></div>

        </aside>

        <section class="session-viewer">

          <div class="session-view-header">

            <span class="session-status">
              Campaign Archive
            </span>

            <h2 id="sessionTitle" class="session-display-title">
              Select a session
            </h2>

          </div>

          <div id="sessionRecap" class="session-display">
            Choose a session from the left.
          </div>

        </section>

      </div>

    </div>

  </section>

</main>

<script src="./sessions.js"></script>

</body>
</html>
