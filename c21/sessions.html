<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>C21 Session Recaps</title>

  <link rel="icon" type="image/png" href="../assets/LogoDrago_Mesa_de_trabajo_1.png" />
  <link rel="stylesheet" href="../style.css" />
</head>

<body>

<main class="page">

  <section class="campaign-dashboard">

    <div class="dashboard-header">
      <div>
        <p class="eyebrow">Campaign Archive</p>
        <h1>Session Records</h1>
      </div>

      <button class="btn" id="newSessionBtn">
        Create Session
      </button>
    </div>

    <div class="dashboard-layout">

      <aside class="session-sidebar">
        <div id="sessionList"></div>
      </aside>

      <section class="session-viewer">

        <div class="session-view-header">

          <span class="session-status">
            Session Editor
          </span>

          <input
            id="sessionTitle"
            class="session-input"
            type="text"
            placeholder="Session 24 • The Battle of Temple Gate II"
          />

        </div>

        <textarea
          id="sessionRecap"
          class="session-textarea"
          placeholder="Write your campaign recap here..."
        ></textarea>

        <div class="session-controls">

          <button class="btn" id="saveSessionBtn">
            Save Session
          </button>

          <button class="btn ghost" id="deleteSessionBtn">
            Delete Session
          </button>

        </div>

      </section>

    </div>

  </section>

  <!-- MODAL -->

  <div class="session-modal" id="sessionModal">

    <div class="session-modal-content">

      <button class="session-close" id="closeModalBtn">
        ×
      </button>

      <span class="session-status">
        Archived Session
      </span>

      <h2 id="modalTitle"></h2>

      <div class="modal-recap" id="modalRecap"></div>

    </div>

  </div>

</main>

<script src="./sessions.js"></script>

</body>
</html>
