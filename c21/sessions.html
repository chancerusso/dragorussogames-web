<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>C21 Session Recaps</title>
  <link rel="icon" type="image/png" href="../assets/LogoDrago_Mesa_de_trabajo_1.png" />
  <link rel="stylesheet" href="../style.css" />
</head>

<body>
<main class="page">

  <section class="hero">
    <div class="hero-card">
      <p class="eyebrow">Campaign 21 • Session Records</p>
      <h1>Dungeons of Drakkenheim</h1>

      <p class="subtitle">
        View, create, edit, and delete campaign session recaps.
      </p>

      <div class="actions">
        <button class="btn" id="newSessionBtn">Create Session</button>
        <a class="btn ghost" href="./index.html">Return to Portal</a>
      </div>
    </div>
  </section>

  <section class="campaign-dashboard">
    <div class="dashboard-layout">

      <aside class="session-sidebar">
        <div id="sessionList"></div>
      </aside>

      <section class="session-viewer">
        <input id="sessionTitle" class="session-input" type="text" placeholder="Session 24 • The Battle of Temple Gate II" />

        <textarea id="sessionRecap" class="session-textarea" placeholder="Write the recap here..."></textarea>

        <div class="session-controls">
          <button class="btn" id="saveSessionBtn">Save Session</button>
          <button class="btn ghost" id="deleteSessionBtn">Delete Session</button>
        </div>
      </section>

    </div>
  </section>

</main>

<script src="./sessions.js"></script>
</body>
</html>
